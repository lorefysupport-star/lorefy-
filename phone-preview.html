<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lorefy - iPhone 16 Pro Max Preview</title>
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#202124; }
    body { display:grid; place-items:center; }
    .phone { position:relative; width:440px; height:956px; padding:0; border-radius:38px; background:transparent; box-shadow:none; transform-origin:center; flex:none; }
    iframe { display:block; width:440px;height:956px; border:0; border-radius:38px; background:#0d0d0f; }
    .phone::after { content:''; position:absolute; bottom:18px; left:50%; transform:translateX(-50%); width:128px; height:5px; border-radius:4px; background:#8c8c91; pointer-events:none; }
  </style>
</head>
<body>
  <div class="phone"><iframe title="Lorefy iPhone 16 Pro Max preview"></iframe></div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      params.set('adaptive', '1');
      if (!params.has('preview')) params.set('preview', 'demo');
      if (params.get('preview') === 'demo') params.set('demo', 'ready');
      if (!params.has('route')) params.set('route', 'profile');
      var frame = document.querySelector('iframe');
      frame.src = 'index.html?' + params.toString();
      function fit() {
        var scale = Math.max(.1, Math.min((innerWidth - 32) / 440, (innerHeight - 32) / 956, 1));
        document.querySelector('.phone').style.transform = 'scale(' + scale + ')';
      }
      window.addEventListener('resize', fit);
      fit();
    })();
  </script>
</body>
</html>
