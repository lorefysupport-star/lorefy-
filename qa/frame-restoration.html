<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../">
<title>Lorefy · Frame Restoration</title><link rel="stylesheet" href="styles/lorefy-frame-motion.css">
<style>
*{box-sizing:border-box;letter-spacing:0}body{margin:0;background:#101516;color:#edf2f1;font:14px/1.5 system-ui,-apple-system,sans-serif}header{padding:16px 24px;border-bottom:1px solid #354346;display:flex;align-items:center;justify-content:space-between;gap:16px}h1{margin:0;font-size:20px}a{color:#9ed8c9;text-decoration:none}main{max-width:1080px;margin:auto;padding:24px;display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:32px}.controls{display:flex;gap:12px;margin-bottom:16px}label{display:flex;align-items:center;gap:8px;min-width:0;flex:1;font-size:12px}select{min-width:0;flex:1;min-height:44px;padding:8px;border:1px solid #526366;border-radius:6px;background:#1b2224;color:inherit;font:inherit}.catalog{min-width:0}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-height:660px;overflow:auto;padding:3px}.choice{display:block;min-width:0;position:relative;background:#1a2123;color:inherit;border:1px solid #3b494c;border-radius:6px;padding:8px;cursor:pointer;font:inherit}.choice[aria-pressed=true]{border-color:#9ed8c9;outline:1px solid #9ed8c9}.thumb{position:relative;display:block;width:100%;aspect-ratio:1}.thumb>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.thumb>.portrait{left:var(--left);top:var(--top);width:var(--size);height:var(--size);inset:auto;object-fit:cover;clip-path:var(--clip)}.choice strong{font-size:12px;display:block;margin-top:6px;overflow-wrap:anywhere}.choice small{font-size:10px;color:#a5b8bb;display:block}.preview{min-width:0}iframe{display:block;width:100%;height:850px;border:1px solid #526366;border-radius:20px;background:#101516}.links{display:flex;justify-content:space-between;gap:12px;margin-top:14px;font-size:12px}.focus{width:200px;aspect-ratio:1;position:relative;margin:18px auto}.focus>img{position:absolute;left:var(--left);top:var(--top);width:var(--size);height:var(--size);object-fit:cover;clip-path:var(--clip)}h2{font-size:17px;margin:0 0 12px}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid #9ed8c9;outline-offset:3px}body[data-theme=light]{background:#f4f8f7;color:#172d2e}body[data-theme=light] .choice,body[data-theme=light] select{background:white;color:#172d2e;border-color:#c4d4d3}body[data-theme=light] a{color:#006b5c}body[data-theme=light] .choice small{color:#526c70}@media(max-width:880px){main{grid-template-columns:minmax(0,1fr);max-width:500px;padding:16px;gap:24px}.choices{max-height:390px}.focus{width:180px}.controls{gap:8px}header{padding:14px}h1{font-size:17px}}
.thumb>.portrait{inset:auto;left:var(--left);top:var(--top)}
</style></head><body data-theme="dark"><header><h1 dir="ltr">Lorefy · Frame Restoration</h1><a href="qa/elf-motion.html?layout=reader&theme=dark">الإلف</a></header>
<main><section class="catalog"><div class="controls"><label>المجموعة<select id="group"><option value="all">جميع الإطارات · ٣٩</option><option value="classic">الأساسية · ٣</option><option value="pfpvibes">PFP Vibes · ٢٤</option><option value="illustrated">المصوّرة · ١٢</option></select></label></div><div class="choices" aria-label="الإطارات الحالية"></div><div class="focus"><img alt="" src="launch/brand/lorefy-reading-scene.jpg"></div><h2 id="selectedName"></h2><a id="video">معاينة PFP وتصدير فيديو</a></section>
<section class="preview"><div class="controls"><label>التخطيط<select id="layout"><option value="normal">الكلاسيكي</option><option value="immersive">البانورامي</option><option value="reader">القارئ</option></select></label><label>المظهر<select id="theme"><option value="dark">داكن</option><option value="light">فاتح</option></select></label></div><iframe title="معاينة الإطار في البروفايل" src="about:blank"></iframe><div class="links"><a id="profile">فتح البروفايل</a><a href="phone-preview.html?preview=demo&demo=ready&route=profile&decorationLab=1">التطبيق المحلي</a></div></section></main>
<script src="modules/lorefy-frame-motion.js"></script><script src="modules/lorefy-bitmap-rig.js"></script><script src="modules/lorefy-frame-restoration.js"></script>
<script>
const params=new URLSearchParams(location.search),list=document.querySelector('.choices'),focus=document.querySelector('.focus'),frame=document.querySelector('iframe'),layout=document.getElementById('layout'),theme=document.getElementById('theme'),group=document.getElementById('group');
let rows=[],selected=params.get('pack')||'original-ribbon-bunny',dispose;
layout.value=['normal','immersive','reader'].includes(params.get('layout'))?params.get('layout'):'reader';theme.value=params.get('theme')==='light'?'light':'dark';
function portraitStyle(node,p){const g=p.geometry;node.style.setProperty('--left',(g.cx-g.size/2)*100+'%');node.style.setProperty('--top',(g.cy-g.size/2)*100+'%');node.style.setProperty('--size',g.size*100+'%');node.style.setProperty('--clip','polygon('+p.portraitClip.map(q=>q.map(v=>v*100+'%').join(' ')).join(',')+')');}
function preview(){
 const p=rows.find(p=>p.id===selected);if(!p)return;
 for(const b of list.children)b.setAttribute('aria-pressed',String(b.dataset.pack===selected));
 document.body.dataset.theme=theme.value;document.getElementById('selectedName').textContent=p.names.ar+' · '+p.names.en;
 if(dispose)dispose();portraitStyle(focus,p);dispose=LorefyFrameMotion.mount(focus,{original:{id:p.id,renderer:'restored'}},'avatar');focus.dataset.pack=p.id;
 frame.src='qa/profile-header.html?decorationLab=1&pack='+p.id+'&layout='+layout.value+'&theme='+theme.value+'&motion=reduced';
 document.getElementById('profile').href=frame.src;document.getElementById('video').href='qa/avatar-animation.html?collection=restored&pack='+p.id+'&theme='+theme.value;
}
function choices(){list.replaceChildren();for(const p of rows.filter(p=>group.value==='all'||p.group===group.value)){
 const b=document.createElement('button');b.type='button';b.className='choice';b.dataset.pack=p.id;b.setAttribute('aria-label',p.names.ar);
 const thumb=document.createElement('span');thumb.className='thumb';portraitStyle(thumb,p);
 const photo=document.createElement('img');photo.className='portrait';photo.src='launch/brand/lorefy-reading-scene.jpg';photo.alt='';photo.loading='lazy';
 const art=document.createElement('img');art.src=p.avatar;art.alt='';art.loading='lazy';thumb.append(photo,art);
 const name=document.createElement('strong');name.textContent=p.names.ar;const en=document.createElement('small');en.textContent=p.names.en;b.append(thumb,name,en);b.onclick=()=>{selected=p.id;preview();};list.append(b);
}preview();}
fetch('launch/decorations/refined/manifest.json').then(r=>{if(!r.ok)throw Error('Missing frame catalog');return r.json();}).then(items=>{rows=items;if(!rows.some(p=>p.id===selected))selected=rows[0].id;choices();});
group.onchange=choices;layout.onchange=preview;theme.onchange=preview;
</script></body></html>
