<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <base href="../">
  <title>Lorefy Atelier — isolated UI QA</title>
  <link rel="stylesheet" href="../styles/lorefy-profile-shop.css?v=20261010-atelier-v1">
  <style>
    :root { --ui-bg:#faf8f3;--ui-surface:#fff;--ui-fill:#eeeae2;--ui-ink:#213536;--ui-muted:#667574;--ui-action:#486d63;--ui-line:#dddcd2;--ui-danger:#b43d35;--nc-top:0px;--nc-bottom:0px; }
    :root[data-qa-theme="dark"] { --ui-bg:#121d20;--ui-surface:#1c2a2e;--ui-fill:#25383e;--ui-ink:#eef2ea;--ui-muted:#abbfbd;--ui-action:#cae0c0;--ui-line:#35494e; }
    * { box-sizing:border-box; } body { margin:0;font:14px Arial,sans-serif;background:var(--ui-bg); }
    .lf-app { position:relative;height:100vh;height:100dvh;overflow:hidden; }
    .lf-profile-page { visibility:hidden; }
  </style>
  <script src="../vendor/react.production.min.js"></script>
  <script src="../vendor/react-dom.production.min.js"></script>
  <script>
    const params=new URLSearchParams(location.search);
    document.documentElement.lang=params.get('lang')==='en'?'en':'ar';
    document.documentElement.dir=document.documentElement.lang==='en'?'ltr':'rtl';
    document.documentElement.dataset.qaTheme=params.get('theme')==='dark'?'dark':'light';
    window.NenIcons={};window.LOREFY_RELEASE={betaProfileDecorations:true};
    window.LorefyBackend={mode:'demo',user:{id:'atelier-layout-fixture'}};
  </script>
  <script defer src="../modules/lorefy-frame-motion.js"></script>
  <script defer src="../modules/lorefy-profile-shop.js?v=20261010-atelier-v1"></script>
</head>
<body>
  <main class="lf-app" id="root">
    <section class="lf-profile-page" data-profile-layout="normal">
      <h1 class="lf-profile-name">Lorefy</h1><p class="lf-profile-handle">@atelier_preview</p>
      <div class="lf-profile-avatar"><img src="../launch/icons/icon-512.png" alt=""></div>
    </section>
  </main>
  <script>document.addEventListener('DOMContentLoaded',()=>LorefyProfileShop.open(),{once:true});</script>
</body>
</html>
