<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lorefy notification acceptance</title>
<link rel="stylesheet" href="../styles/lorefy-notification-center.css">
<style>
*{box-sizing:border-box;letter-spacing:0}body{margin:0;background:#202224;font-family:Readex,system-ui,sans-serif;color:#fff}
.controls{display:flex;gap:8px;flex-wrap:wrap;padding:12px;max-width:650px;margin:auto}.controls button,.controls select{font:inherit;min-height:44px;padding:8px;border-radius:6px;border:1px solid #777;background:#303438;color:#fff}
output{display:block;max-width:650px;margin:0 auto 12px;font:12px/1.5 monospace;direction:ltr}
.lf-app{--ui-bg:#101113;--ui-surface:#22252a;--ui-fill:#24272b;--ui-ink:#f7f7f8;--ui-secondary:#b6bac2;--ui-muted:#a3a9b2;--ui-line:#383c44;--ui-action:#87ebd9;--ui-selected:#20443e;--ui-glass-ink:var(--ui-ink);--ui-glass-secondary:var(--ui-secondary);--ui-glass-action:var(--ui-action);--glass-reflection:linear-gradient(135deg,#ffffff16,#ffffff00);--glass-sheet:#24272be8;--glass-blur:blur(20px);--ui-page-wash:none;color:var(--ui-ink);max-width:430px;margin:auto;background:var(--ui-bg);height:780px;overflow:auto;border:1px solid var(--ui-line);border-radius:24px}
.lf-app[data-theme=light]{--ui-bg:#f7f8fa;--ui-surface:#fff;--ui-fill:#eef0f3;--ui-ink:#17252b;--ui-secondary:#52606d;--ui-muted:#61707c;--ui-line:#d2d9df;--ui-action:#066d73;--ui-selected:#d9efed;--glass-sheet:#fffffff0}
.lf-app[data-theme=pink]{--ui-bg:#fcf1f6;--ui-surface:#fff8fc;--ui-fill:#f2e1e9;--ui-ink:#342731;--ui-secondary:#705462;--ui-muted:#795b6c;--ui-line:#dec3d0;--ui-action:#a22260;--ui-selected:#f0d3e1;--glass-sheet:#fff8fcdd}
.lf-notifications-page{min-height:100%;padding-bottom:24px!important}header{display:flex;align-items:center;gap:10px}header button{font:inherit;border:0;background:none;cursor:pointer}header button:first-child{width:44px;height:44px;border-radius:50%}button{font-family:inherit}
.lf-local-notification{padding:16px 18px;border-bottom:1px solid var(--ui-line);font-size:14px;line-height:1.7}.lf-inbox-filter-empty[hidden]{display:none}
@media(max-width:460px){.lf-app{width:100%;border-radius:0;border-inline:0;height:calc(100dvh - 180px)}}
</style>
<div class="controls">
 <select id="theme" aria-label="Theme"><option value="dark">Dark</option><option value="light">Light</option><option value="pink">Pink</option></select>
 <button id="language">English</button><button id="new">New mention</button><button id="refresh">Unchanged refresh</button><button id="failure">Offline refresh</button><button id="restore">Restore connection</button>
</div>
<output id="receipt" role="status"></output>
<main class="lf-app" data-theme="dark"><div class="lf-notifications-page">
 <header><button aria-label="رجوع">‹</button><h1>الإشعارات</h1><button data-inbox-mark-all data-local-unread="false">قراءة الكل</button></header>
 <p>No notifications yet</p>
 <div class="lf-local-notification" data-local-kind="other" data-local-read="true">فصول جديدة من عمل تتابعه · إشعار محفوظ</div>
</div></main>
<script>
const owner='11111111-1111-4111-8111-111111111111',actor='22222222-2222-4222-8222-222222222222';
let remote,reads=0,receipts=0,offline=false,serial=10,firstNode;
const events=['post_mention','review_comment','post_like','follow','review_reply'];
const names=['نورة','عبدالرحمن','ريم','فهد','سارة'];
const rows=events.map((event,i)=>({id:'00000000-0000-4000-8000-'+String(i+1).padStart(12,'0'),user_id:owner,actor_id:actor,kind:event.includes('mention')?'mention':event==='follow'?'follow':event.includes('like')?'reaction':'comment',data:{event,actorName:names[i]},created_at:new Date(Date.now()-(i+1)*60000).toISOString(),read_at:i===4?new Date().toISOString():null,target_path:'/notifications'}));
window.LorefyBackend={getSession:async()=>({userId:owner}),listNotifications:async()=>{reads++;if(offline)throw Error('offline fixture');return rows.map(r=>({...r}));},subscribeNotifications:async fn=>{remote=fn;return()=>{};},markNotificationsRead:async ids=>{receipts+=ids.length;rows.forEach(r=>{if(ids.includes(r.id))r.read_at=new Date().toISOString();});return true;}};
function report(){const node=document.querySelector('[data-notification-id]');if(!firstNode&&node)firstNode=node;const next='reads='+reads+' receipts='+receipts+' retained='+!!(firstNode&&firstNode.isConnected)+' rows='+document.querySelectorAll('[data-notification-id]').length;const receipt=document.getElementById('receipt');if(receipt.textContent!==next)receipt.textContent=next;}
new MutationObserver(report).observe(document.querySelector('.lf-app'),{subtree:true,childList:true});
document.getElementById('theme').onchange=e=>document.querySelector('.lf-app').dataset.theme=e.target.value;
document.getElementById('language').onclick=()=>{const en=document.documentElement.lang!=='en';document.documentElement.lang=en?'en':'ar';document.documentElement.dir=en?'ltr':'rtl';document.querySelector('h1').textContent=en?'Notifications':'الإشعارات';document.querySelector('[data-inbox-mark-all]').textContent=en?'Mark all read':'قراءة الكل';LorefyNativeRuntime.refreshCloudNotifications();};
document.getElementById('new').onclick=()=>{const row={...rows[0],id:'00000000-0000-4000-8000-'+String(++serial).padStart(12,'0'),read_at:null,created_at:new Date().toISOString()};rows.unshift(row);remote(row,{event:'INSERT'});report();};
document.getElementById('refresh').onclick=()=>LorefyNativeRuntime.refreshCloudNotifications();
document.getElementById('failure').onclick=()=>{offline=true;LorefyNativeRuntime.refreshCloudNotifications();};
document.getElementById('restore').onclick=()=>{offline=false;LorefyNativeRuntime.refreshCloudNotifications();};
</script>
<script src="../vendor/lucide.runtime.min.js"></script>
<script src="../modules/lorefy-notification-center.js"></script>
<script src="../backend/lorefy-native-runtime.js"></script>
</html>
