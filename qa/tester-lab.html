<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lorefy - مختبر الشخصيات</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f8;color:#142a36;font-family:Arial,sans-serif}header{padding:24px;border-bottom:1px solid #ccd9df}h1{margin:0;font-size:24px}header p{margin-bottom:0;color:#405a67}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;padding:24px}article{overflow:hidden;border:1px solid #ccd9df;border-radius:8px;background:#fff}.banner{height:110px;width:100%;object-fit:cover}.identity{display:flex;align-items:center;gap:12px;padding:14px}.avatar{width:56px;height:56px;object-fit:cover;border-radius:50%}h2{font-size:18px;margin:0 0 6px}small{color:#526974}.actions{display:flex;gap:12px;padding:0 14px 16px}.actions a{display:block;text-decoration:none;color:#066c70;padding:10px 0;font-weight:700}footer{padding:0 24px 24px;color:#405a67}
</style>
<header><h1>مختبر الشخصيات</h1><p>10 شخصيات وهمية، 10 مراجعات تجريبية. البيانات معزولة عن الحسابات الحقيقية.</p></header><main id="testers"></main><footer>كل شخصية لها مكتبة وتقييمات ومفضلة وتوب 10 مستقلة. تعديلات الاختبار تبقى محلية.</footer>
<script src="tester-data.js"></script><script>
for(const p of LorefyTesterData.profiles){const card=document.createElement('article');const banner=document.createElement('img');banner.className='banner';banner.src=p.banner;banner.alt='';card.append(banner);const identity=document.createElement('div');identity.className='identity';const avatar=document.createElement('img');avatar.className='avatar';avatar.src=p.avatar;avatar.alt='';const copy=document.createElement('div');const name=document.createElement('h2');name.textContent=p.name+' / '+p.latin;const handle=document.createElement('small');handle.textContent='@'+p.username+' · '+p.formats.join(' · ');copy.append(name,handle);identity.append(avatar,copy);card.append(identity);const actions=document.createElement('div');actions.className='actions';for(const [lang,label] of [['ar','العربية'],['en','English']]){const link=document.createElement('a');link.textContent=label;link.href='tester-app.html?preview=demo&demo=ready&adaptive=1&qaTester='+p.id+'&lang='+lang+'&route=profile';link.target='_blank';actions.append(link);}card.append(actions);document.getElementById('testers').append(card);}
</script></html>
