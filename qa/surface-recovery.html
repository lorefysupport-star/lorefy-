<!doctype html>
<html lang="ar" dir="rtl">

<div id="root"></div>

<script src="../vendor/react.production.min.js"></script>
<script src="../vendor/react-dom.production.min.js"></script>
<script src="../modules/lorefy-ui-runtime.js"></script>

  if(new URLSearchParams(location.search).get('lang')==='en'){document.documentElement.lang='en';document.documentElement.dir='ltr';}

  }
  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(LorefyUI.AppShell,null,React.createElement(Page)));
</script>
