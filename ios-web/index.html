  html,body{margin:0;height:100%;background:#0b0f0e;
    overflow:hidden;font-family:'Readex Pro',-apple-system,sans-serif;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  /* ── iPhone device ── */
  #device{
    --nc-top:48px; --nc-bottom:26px;
    width:390px;height:844px;position:relative;flex-shrink:0;
    transform-origin:center center;
    border-radius:54px;
    background:#0c0b11;
    padding:13px;
    box-shadow:
      0 0 0 13px #1a1a1d,
      0 0 0 15px #2c2c30,
      0 0 0 16px #0c0c0e,
      0 50px 110px -20px rgba(0,0,0,0.75),
      0 22px 50px -25px rgba(0,0,0,0.9);
  }
  #screen{
    position:absolute;inset:13px;border-radius:42px;overflow:hidden;background:#fff;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,0.4);
  }
  #root{position:absolute;inset:0;}
  .lf-bootstrap-splash{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:10px;background:#0d0d0f;color:#f7f4f3;
    font-family:'Readex Pro','Cairo',sans-serif;text-align:center;
  }
  .lf-bootstrap-logo{width:76px;height:76px;object-fit:contain;filter:drop-shadow(0 14px 25px rgba(138,76,255,.3));animation:lfBootstrapBreathe 1.7s ease-in-out infinite;}
  .lf-bootstrap-splash strong{font-size:25px;font-weight:800;}
  .lf-bootstrap-splash small{color:#a8a3a7;font-size:12px;}
  @keyframes lfBootstrapBreathe{50%{transform:translateY(-4px) scale(1.025);filter:drop-shadow(0 18px 32px rgba(138,76,255,.5));}}
  /* Dynamic Island */
  #island{
    position:absolute;top:11px;left:50%;transform:translateX(-50%);
    width:118px;height:33px;background:#000;border-radius:20px;z-index:9000;
    pointer-events:none;
  }
  /* Status bar */
  #statusbar{
    position:absolute;top:0;left:0;right:0;height:var(--nc-top);
    display:flex;align-items:flex-start;justify-content:space-between;
    padding:17px 30px 0;z-index:8999;pointer-events:none;
    font-family:-apple-system,'SF Pro Text','Readex Pro',sans-serif;
    direction:ltr;color:#111;transition:color .3s ease;
  }
  #statusbar.dark{color:#fff;}
  #sb-time{font-size:15px;font-weight:600;letter-spacing:.3px;}
  #sb-right{display:flex;align-items:center;gap:6px;}
  #sb-right svg{display:block;}
  .hint{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    color:rgba(255,255,255,0.34);font-size:12px;letter-spacing:.02em;
    font-family:'Readex Pro',sans-serif;direction:rtl;text-align:center;
    pointer-events:none;white-space:nowrap;
  }
  @media (max-width: 600px), (display-mode: standalone) {
    html,body{background:#F6F5FA;overflow:hidden;}
    #stage{display:block;}
    #device{
      /* WKWebView occasionally reports zero insets during bootstrap. Keep a
         usable iPhone baseline, while respecting any larger real device inset. */
      --nc-top:max(env(safe-area-inset-top, 0px), 48px);
      --nc-bottom:max(env(safe-area-inset-bottom, 0px), 26px);
      width:100vw;height:100dvh;padding:0;border-radius:0;
      transform:none!important;background:#F6F5FA;box-shadow:none;
    }
    #screen{inset:0;border-radius:0;box-shadow:none;}
    #island,#statusbar,.hint{display:none;}
  }
  html[data-lorefy-adaptive-shell="true"],
  html[data-lorefy-adaptive-shell="true"] body{width:100%;height:100%;background:#F6F5FA;overflow:hidden;}
  html[data-lorefy-adaptive-shell="true"] #stage{display:block;}
  html[data-lorefy-adaptive-shell="true"] #device{
    --nc-top:max(env(safe-area-inset-top, 0px), 48px);
    --nc-bottom:max(env(safe-area-inset-bottom, 0px), 26px);
    width:100vw;height:100dvh;min-height:100svh;max-width:none;max-height:none;
    padding:0;border-radius:0;transform:none!important;background:#F6F5FA;box-shadow:none;
  }
  html[data-lorefy-adaptive-shell="true"] #screen{inset:0;border-radius:0;box-shadow:none;}
  html[data-lorefy-adaptive-shell="true"] #island,
  html[data-lorefy-adaptive-shell="true"] #statusbar,
  html[data-lorefy-adaptive-shell="true"] .hint{display:none;}

      var node = lookup(name);

        props = props || {};
        var size = props.size != null ? props.size : 24;
        var color = props.color || 'currentColor';
        if (!node){ // fallback: rounded square
          return h('svg', { width:size, height:size, viewBox:'0 0 24 24', fill:'none',
            stroke:color, strokeWidth:2, style:props.style },
            h('rect',{ key:0, x:4, y:4, width:16, height:16, rx:3 }));
        }
        var raw = node[1] || {}, kids = node[2] || [];
        var attrs = {

          stroke:color, strokeWidth: props.strokeWidth || raw['stroke-width'] || 2,
          strokeLinecap:'round', strokeLinejoin:'round', style:props.style,
          className: props.className

        return h('svg', attrs, kids.map(function(n,i){ return toEl(n,i); }));
      };
    }
    // Proxy: any icon name the app destructures resolves to a component.
    var iconCache = {};
    window.NenIcons = new Proxy({}, {
      get: function(t, name){
        if (typeof name !== 'string') return undefined;
        if (!iconCache[name]) iconCache[name] = makeIcon(name);
        return iconCache[name];
      }
    });

    /* ── Brand logo components (placeholder lockups) ── */
    function lorefyMark(size, style){
      return h('img', { src:'launch/brand/lorefy-feather.png?v=20260805-brand-v1', alt:'', width:size, height:size,

  <script>
    window.LorefyMangaData = window.LorefyMangaData || [];
    (function(){
      var params = new URLSearchParams(location.search || '');

  <script>
    (function(){
      var params = new URLSearchParams(location.search || '');
      var directId = params.get('route') === 'detail' ? params.get('novel') : '';
      if (!directId) return;
      try {
        var raw = sessionStorage.getItem('lorefy.catalog.openWork.v1');
        var stored = raw ? JSON.parse(raw) : null;
        if (stored && stored.id === directId && typeof stored.title === 'string' &&
          !window.LorefyMangaData.some(function(work){ return work && work.id === directId; })) {
          window.LorefyMangaData.push(stored);
        }
      } catch (error) {}
    })();

  window.LOREFY_DEFERRED_ASSETS = [
      "uploads/lorefy-ar-enrichment.js?v=20260707-lazy-v1",
      "modules/lorefy-api-catalog.js?v=20261008-arabic-breadth-v4"

  <!-- Mount: auth gate → app -->
  <script>
    (document.readyState === 'loading' ? window.addEventListener.bind(window, 'DOMContentLoaded') : function(fn){ fn(); })(function(){
    (function(){
      var tweaks = {
        accent: "#9D4EDD",   // بنفسجي Lorefy
        logo: "الشرارة",      // spark lockup
        navStyle: "ثابت",     // fixed tab bar
        navLabels: true
      };
      var statusbar = document.getElementById('statusbar');
      function readSavedDarkTheme(){
        return window.LorefyDesignSystem.isDark(window.LorefyDesignSystem.readMode(localStorage));
      }
      function applyThemeShell(dark, mode){
        dark = !!dark;
        mode = window.LorefyDesignSystem.normalizeMode(mode || window.LorefyDesignSystem.readMode(localStorage));
        dark = window.LorefyDesignSystem.isDark(mode);
        document.documentElement.dataset.lorefyTheme = mode;
        var tokens = window.LorefyDesignSystem.tokens(mode);
        Object.keys(tokens).forEach(function(key){document.documentElement.style.setProperty(key,tokens[key]);});
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.body.dataset.lorefyTheme = mode;
        if (statusbar) statusbar.classList.toggle('dark', dark);
        var screen = document.getElementById('screen');
        if (screen) screen.style.background = window.LorefyDesignSystem.palette(mode).bg;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', window.LorefyDesignSystem.palette(mode).bg);
        try { window.dispatchEvent(new CustomEvent('lorefy:theme', { detail: { dark: dark, mode: mode } })); } catch (e) {}
      }
      function onTheme(dark, mode){
        mode = mode || (dark ? 'dark' : 'light');
        try { localStorage.setItem('lorefy.ui.theme.v1', mode); } catch (e) {}
        applyThemeShell(dark, mode);
      }
      var root = ReactDOM.createRoot(document.getElementById('root'));

      function renderSurface(element){
        root.render(React.createElement(window.LorefyUI.AppShell, null, element));
      }
      /* Keep remote artwork from leaving empty boxes when a provider is slow or offline. */
      function installImageResilience(){
        if (window.__lorefyImageResilience) return;
        window.__lorefyImageResilience = true;
        var coverFallback = "data:image/svg+xml;charset=utf-8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6D35C8"/><stop offset="1" stop-color="#1D274D"/></linearGradient></defs><rect width="300" height="450" fill="url(#g)"/><circle cx="230" cy="76" r="92" fill="#FFFFFF" opacity=".1"/><path d="M36 376c55-54 116-64 228-20v58H36z" fill="#0B0A12" opacity=".55"/><text x="150" y="246" fill="#FFFFFF" opacity=".9" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700">LOREFY</text></svg>');
        var avatarFallback = "data:image/svg+xml;charset=utf-8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160"><rect width="160" height="160" rx="80" fill="#E9E0FF"/><circle cx="80" cy="62" r="28" fill="#7A4BD8"/><path d="M30 143c6-34 26-51 50-51s44 17 50 51" fill="#7A4BD8"/><circle cx="80" cy="80" r="72" fill="none" stroke="#FFFFFF" stroke-width="5" opacity=".7"/></svg>');
        var observer = null;
        var nearViewport = function(img){
          try{
            var rect = img.getBoundingClientRect();
            return rect.bottom >= -240 && rect.top <= (window.innerHeight || document.documentElement.clientHeight) + 240;
          }catch(e){ return true; }
        };
        var fallbackFor = function(img){
          var explicit = img.getAttribute("data-fallback") || "";
          if (/^data:image\//i.test(explicit)) return explicit;
          var context = String(img.alt || "") + " " + String(img.className || "");
          try{ context += " " + String((img.closest("[class]") || {}).className || ""); }catch(e){}
          var coverLike = /cover|hero|poster|work/i.test(context);
          return !coverLike && /avatar|profile|portrait|character|author|user/i.test(context) ? avatarFallback : coverFallback;
        };
        var armTimeout = function(img, fallback){
          if (img.dataset.lorefyImageTimer || img.dataset.lorefyFallbackApplied === "1") return;
          if (img.loading === "lazy" && !img.dataset.lorefyImageInViewport){
            if (observer) { observer.observe(img); return; }
            if (!nearViewport(img)) return;
          }
          img.dataset.lorefyImageTimer = "1";
          window.setTimeout(function(){
            if (!img.complete || img.naturalWidth === 0){
              if (img.hasAttribute("data-cover-picker-image")) {
                img.dispatchEvent(new Event("error"));
                return;
              }
              img.dataset.lorefyFallbackApplied = "1";
              img.removeAttribute("srcset");
              img.src = fallback;
            }
          }, 5500);
        };
        var guard = function(img){
          if (!img || img.dataset.lorefyImageGuard === "1") return;
          var src = img.getAttribute("src") || "";
          if (!/^https?:\/\//i.test(src) && !/^\/api\/media(?:\?|$)/i.test(src)) return;
          img.dataset.lorefyImageGuard = "1";
          // A cover choice must not be replaced by a selectable generated cover.
          if (img.hasAttribute("data-cover-picker-image")) {
            armTimeout(img, "");
            return;
          }
          var fallback = fallbackFor(img);
          img.style.backgroundImage = 'url("' + fallback.replace(/"/g, "%22") + '")';
          img.style.backgroundSize = "cover";
          img.style.backgroundPosition = "center";
          img.addEventListener("error", function(){
            if (img.dataset.lorefyFallbackApplied === "1") return;
            img.dataset.lorefyFallbackApplied = "1";
            img.removeAttribute("srcset");
            img.src = fallback;
          }, { once: true });
          armTimeout(img, fallback);
        };
        observer = "IntersectionObserver" in window ? new IntersectionObserver(function(entries){
          entries.forEach(function(entry){
            if (!entry.isIntersecting) return;
            entry.target.dataset.lorefyImageInViewport = "1";
            observer.unobserve(entry.target);
            armTimeout(entry.target, fallbackFor(entry.target));
          });
        }, { rootMargin: "240px" }) : null;
        var pendingImages = new Set();
        var scanQueued = false;
        var queueScan = function(records){
          records.forEach(function(record){
            if (record.type === "attributes") pendingImages.add(record.target);
            else record.addedNodes.forEach(function(node){
              if (node.nodeType !== 1) return;
              if (node.tagName === "IMG") pendingImages.add(node);
              node.querySelectorAll("img").forEach(function(img){ pendingImages.add(img); });
            });
          });
          if (scanQueued || !pendingImages.size) return;
          scanQueued = true;
          var flush = function(){
            scanQueued = false;
            pendingImages.forEach(function(img){ if (img.isConnected) guard(img); });
            pendingImages.clear();
          };
          if (window.requestAnimationFrame) window.requestAnimationFrame(flush);
          else window.setTimeout(flush, 0);
        };
        document.querySelectorAll("img").forEach(guard);
        new MutationObserver(queueScan).observe(document.documentElement, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ["src", "srcset"]
        });
      }
      function mountApp(){
        installImageResilience();
        applyThemeShell(readSavedDarkTheme());
        renderSurface(React.createElement(window.NenApp, { tweaks: tweaks, onTheme: onTheme }));
        if (window.__fitDevice) window.__fitDevice();
        ensureGrowthFeatures();
        scheduleDeferredLorefyAssets();
      }
      function ensureGrowthFeatures(){
        setTimeout(function(){
          if (window.LorefyGrowth) return;
          window.__lorefyGrowthRetryCount = (window.__lorefyGrowthRetryCount || 0) + 1;
          if (window.__lorefyGrowthRetryCount > 3) return;
          var script = document.createElement('script');
      script.src = 'modules/lorefy-growth-features.js?v=20261015-editor-hydration-v1' + window.__lorefyGrowthRetryCount + '-' + Date.now();
          script.async = false;
          document.head.appendChild(script);
        }, 400);
      }
      [800, 1800, 4200].forEach(function(ms){ setTimeout(ensureGrowthFeatures, ms); });
      var deferredLorefyAssetsStarted = false;
      function scheduleDeferredLorefyAssets(){
        if (deferredLorefyAssetsStarted) return;
        deferredLorefyAssetsStarted = true;
        var queue = (window.LOREFY_DEFERRED_ASSETS || []).slice();
        function idle(callback, timeout){
          if ('requestIdleCallback' in window) requestIdleCallback(callback, { timeout: timeout || 4000 });
          else setTimeout(callback, 900);
        }
        function loadScript(src){
          return new Promise(function(resolve){
            var script = document.createElement('script');
            script.src = src;
            script.async = false;
            script.onload = script.onerror = function(){ resolve(); };
            document.head.appendChild(script);
          });
        }
        function refreshCatalog(){
          try { if (window.__lorefyIngest) window.__lorefyIngest(); }
          catch(e){}
          try { if (window.__lorefyRefresh) window.__lorefyRefresh(); }
          catch(e){}
        }
        function next(){
          var src = queue.shift();
          if (!src) { refreshCatalog(); return; }
          loadScript(src).then(function(){
            refreshCatalog();
            setTimeout(function(){ idle(next, 5000); }, 1400);
          });
        }
        setTimeout(next, 6500);
      }
      function localIdentity(){ try{ return JSON.parse(localStorage.getItem('lorefy.identity.v1')||'null'); }catch(e){ return null; } }
      function localPreferences(){
        try{
          return JSON.parse(localStorage.getItem('lorefy.user.preferences.v2')||localStorage.getItem('lorefy.user.preferences.v1')||'null');
        }catch(e){ return null; }
      }
      function mountGate(startStep){
        applyThemeShell(readSavedDarkTheme());
        renderSurface(React.createElement(window.LorefyAuthGate, { startStep: startStep, onComplete: mountApp }));
        if (window.__fitDevice) window.__fitDevice();
      }

      async function preparePremiumState(BE, sess){
        window.LOREFY_FEATURES = window.LOREFY_FEATURES || {};
        var preview = window.__LOREFY_LOCAL_PREMIUM_PREVIEW === true ||
          !!(window.LOREFY_RELEASE && window.LOREFY_RELEASE.betaPremiumUnlocked);
        window.LOREFY_FEATURES.premium = preview;
        if (preview) return false;
        try { localStorage.removeItem("lorefy.user.premium.v2"); } catch (e) {}
        if (!BE || BE.mode !== "live" || !sess || typeof BE.getEntitlements !== "function") return false;
        try {
          var rows = await BE.getEntitlements();
          var now = Date.now();
          var active = (Array.isArray(rows) ? rows : []).some(function(row){
            var status = String(row && row.status || "").toLowerCase();
            if (["active", "trialing", "grace"].indexOf(status) === -1) return false;
            if (!row.expires_at) return true;
            var expires = Date.parse(row.expires_at);
            return !Number.isNaN(expires) && expires > now;
          });
          window.LOREFY_FEATURES.premium = active;
          if (active) {
            try { localStorage.setItem("lorefy.user.premium.v2", "true"); } catch (e) {}
          }
          return active;
        } catch (e) {
          window.LOREFY_FEATURES.premium = false;
          try { localStorage.removeItem("lorefy.user.premium.v2"); } catch (ignore) {}
          return false;
        }
      }

      (async function(){
        var BE = window.LorefyBackend;
        try { if (BE && BE.init) await BE.init(); } catch(e){}
        var sess = null;
        try { sess = BE && BE.getSession ? await BE.getSession() : null; } catch(e){
          root.render(React.createElement('div', { role:'alert', style:{ padding:'80px 24px', textAlign:'center' } },
            React.createElement('p', null, 'تعذر الاتصال للتحقق من جلستك. بياناتك محفوظة؛ حاول مجدداً.'),
            React.createElement('button', { type:'button', onClick:function(){ location.reload(); } }, 'إعادة المحاولة')));
          return;
        }
        var previewParams = new URLSearchParams(location.search || "");
        var directLocalDemo = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) &&
          previewParams.get("preview") === "demo" && previewParams.get("demo") === "ready";
        if (directLocalDemo && BE && BE.mode === "demo" && !sess) {
          try {
            await BE.signInWithOAuth("google");
            sess = BE.getSession ? await BE.getSession() : sess;
            localStorage.setItem("lorefy.identity.v1", JSON.stringify({
              name: "قارئ Lorefy",
              un: "lorefy_demo",
              bio: "حساب العرض المحلي",
              avatar: "",
              banner: ""
            }));
            localStorage.setItem("lorefy.user.preferences.v2", JSON.stringify({
              version: 2,
              formats: ["مانجا", "مانهوا", "رواية"],
              genres: ["أكشن", "خيال", "مغامرة"],
              seedWorkIds: [],
              discovery: [],
              onboardingVersion: 2
            }));
          } catch(e) {}
        }
        if (window.LorefyPreviewReaders) {
          try { await window.LorefyPreviewReaders.prepare(BE, sess); }
          catch (error) { console.warn('[Lorefy] preview readers:', error); }
        }
        await preparePremiumState(BE, sess);
        if (sess && BE.mode === 'live' && BE.pull) { try{ await BE.pull(sess.userId); }catch(e){} }
        if (sess && BE.startSync) { try{ BE.startSync(sess.userId); }catch(e){} }
        if (sess && window.LorefyArtwork) { try{ await window.LorefyArtwork.hydrate(sess.userId); }catch(e){ console.warn('[Lorefy] artwork restore:',e); } }
        var id = localIdentity();
        var preferences = localPreferences();
        var ready = !!(sess && id && id.name && id.un && preferences && preferences.onboardingVersion === 2);
        if (BE && BE.passwordRecovery) mountGate('recovery');
        else if (ready) mountApp();
        else if (sess && id && id.name && id.un) mountGate('preferences');
        else if (sess) mountGate('account');
        else mountGate('welcome');
      })();
    })();
    });
  </script>

  <!-- Local previews always use live files; production keeps the offline PWA cache. -->
  <script>
    var isLocalPreview = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(window.location.hostname);
    if (isLocalPreview) {
      window.addEventListener('load', function(){
        var clearWorkers = 'serviceWorker' in navigator
          ? navigator.serviceWorker.getRegistrations().then(function(registrations){
              return Promise.all(registrations.map(function(registration){
                return registration.unregister();
              }));
            })
          : Promise.resolve();
        var clearCaches = 'caches' in window
          ? caches.keys().then(function(keys){
              return Promise.all(keys.map(function(key){ return caches.delete(key); }));
            })
          : Promise.resolve();
        Promise.all([clearWorkers, clearCaches]).catch(function(){});
      });
    } else if ('serviceWorker' in navigator && window.top === window.self) {
      window.addEventListener('load', function(){
        navigator.serviceWorker.register('sw.js?v=20261015-device-repairs-v1')
          .catch(function(){});
      });
    }
  </script>
